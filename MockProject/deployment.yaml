apiVersion: apps/v1
kind: Deployment
metadata:
  name: long-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: long-app
  template:
    metadata:
      labels:
        app: long-app
    spec:
      containers:
      - name: long-app
        image: 475309741409.dkr.ecr.ap-southeast-1.amazonaws.com/long-app:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: long-app-svc
spec:
  type: NodePort
  selector:
    app: long-app
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
